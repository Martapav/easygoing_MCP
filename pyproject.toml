[project]
name = "easygoing-mcp"
version = "0.1.0"
description = "MCP server exposing EasyGoing live broadcast transcripts (transcript-only prototype)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==2.3.0",
    "pydantic==2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easygoing_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
